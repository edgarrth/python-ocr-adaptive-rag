name: axiz-adaptive-rag-payments

x-backend-image: &backend-image
  image: axiz-adaptive-rag-backend:local
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile.ai
    target: backend

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: axiz-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - axiz-rag
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.13.1
    container_name: axiz-rag-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    networks:
      - axiz-rag
    restart: unless-stopped


  glm-ocr:
    image: axiz-glm-ocr:local
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.glm-ocr
    container_name: axiz-rag-glm-ocr
    env_file:
      - path: ../.env
        required: false
    command:
      - --model
      - zai-org/GLM-OCR
      - --served-model-name
      - glm-ocr
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --max-model-len
      - "16384"
      - --gpu-memory-utilization
      - "0.75"
    gpus: all
    ipc: host
    ports:
      - "8080:8080"
    volumes:
      - hf_cache_data:/root/.cache
      - vllm_cache_data:/root/.cache/vllm
    networks:
      - axiz-rag
    restart: unless-stopped

  raglight-service:
    image: axiz-raglight-service:local
    env_file:
      - path: ../.env
        required: false
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ai
      target: raglight
    container_name: axiz-rag-raglight
    environment:
      QDRANT_URL: http://qdrant:6333
      RAGLIGHT_CANONICAL_DIR: /app/.runtime/canonical
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
    ports:
      - "8010:8010"
    volumes:
      - runtime_data:/app/.runtime
      - hf_cache_data:/app/.cache
    depends_on:
      - qdrant
    networks:
      - axiz-rag
    restart: unless-stopped

  backend:
    <<: *backend-image
    container_name: axiz-rag-backend
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: docker
      API_HOST: 0.0.0.0
      API_PORT: 8000
      QDRANT_URL: http://qdrant:6333
      MEMGRAPH_URI: bolt://memgraph:7687
      RAGLIGHT_SERVICE_URL: http://raglight-service:8010
      LIGHTRAG_WORKDIR: /app/.runtime/lightrag
      DATASETS_DIR: /app/datasets/sample_documents
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
      GLM_OCR_MODE: selfhosted
      GLM_OCR_API_URL: http://glm-ocr:8080/v1/chat/completions
      GLM_OCR_MODEL: glm-ocr
      GLM_OCR_LAYOUT_DEVICE: cpu
      GLM_OCR_MAX_WORKERS: "4"
      GLM_OCR_REQUEST_TIMEOUT_SECONDS: "300"
      OCR_POLICY: auto
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/.runtime
      - hf_cache_data:/app/.cache
    depends_on:
      - qdrant
      - memgraph
      - raglight-service
      - glm-ocr
    networks:
      - axiz-rag
    restart: unless-stopped

  dataset-seed:
    <<: *backend-image
    container_name: axiz-rag-dataset-seed
    command:
      - python
      - datasets/seed.py
      - --api
      - http://backend:8000
      - --wait-seconds
      - "900"
      - --retry-interval
      - "3"
    depends_on:
      - backend
      - raglight-service
    networks:
      - axiz-rag
    restart: "no"

  frontend:
    image: axiz-adaptive-rag-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: axiz-rag-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
      dataset-seed:
        condition: service_completed_successfully
    networks:
      - axiz-rag
    restart: unless-stopped

networks:
  axiz-rag:
    name: axiz-adaptive-rag-network

volumes:
  qdrant_data:
  memgraph_data:
  runtime_data:
  hf_cache_data:
  vllm_cache_data:
