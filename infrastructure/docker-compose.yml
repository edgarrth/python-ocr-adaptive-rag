name: axiz-adaptive-rag-payments

x-backend-image: &backend-image
  image: axiz-adaptive-rag-backend:local
  build:
    context: ..
    dockerfile: backend/Dockerfile

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: axiz-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - axiz-rag
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.13.1
    container_name: axiz-rag-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    networks:
      - axiz-rag
    restart: unless-stopped

  raglight-service:
    image: axiz-raglight-service:local
    build:
      context: ..
      dockerfile: raglight_service/Dockerfile
    container_name: axiz-rag-raglight
    environment:
      QDRANT_URL: http://qdrant:6333
      RAGLIGHT_COLLECTION: axiz_payment_raglight
      RAGLIGHT_EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      RAGLIGHT_CANONICAL_DIR: /app/.runtime/canonical
    ports:
      - "8010:8010"
    volumes:
      - runtime_data:/app/.runtime
    depends_on:
      - qdrant
    networks:
      - axiz-rag
    restart: unless-stopped

  backend:
    <<: *backend-image
    container_name: axiz-rag-backend
    environment:
      APP_ENV: docker
      API_HOST: 0.0.0.0
      API_PORT: 8000
      CORS_ORIGINS: http://localhost:4200
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: axiz_payment_chunks
      RAGLIGHT_COLLECTION: axiz_payment_raglight
      RAGLIGHT_SERVICE_URL: http://raglight-service:8010
      RAGLIGHT_TIMEOUT_SECONDS: 600
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_DIMENSION: 384
      MEMGRAPH_URI: bolt://memgraph:7687
      MEMGRAPH_USER: ""
      MEMGRAPH_PASSWORD: ""
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIMENSION: ${OPENAI_EMBEDDING_DIMENSION:-1536}
      GLM_OCR_MODE: ${GLM_OCR_MODE:-maas}
      GLM_OCR_API_URL: ${GLM_OCR_API_URL:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      OCR_MIN_TEXT_CHARS: 120
      RAGLIGHT_ENABLED: ${RAGLIGHT_ENABLED:-true}
      LIGHTRAG_ENABLED: ${LIGHTRAG_ENABLED:-true}
      LIGHTRAG_WORKDIR: /app/.runtime/lightrag
      DATASETS_DIR: /app/datasets/sample_documents
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/.runtime
    depends_on:
      - qdrant
      - memgraph
      - raglight-service
    networks:
      - axiz-rag
    restart: unless-stopped

  dataset-seed:
    <<: *backend-image
    container_name: axiz-rag-dataset-seed
    command:
      - python
      - datasets/seed.py
      - --api
      - http://backend:8000
      - --wait-seconds
      - "900"
      - --retry-interval
      - "3"
    depends_on:
      - backend
      - raglight-service
    networks:
      - axiz-rag
    restart: "no"

  frontend:
    image: axiz-adaptive-rag-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: axiz-rag-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
      dataset-seed:
        condition: service_completed_successfully
    networks:
      - axiz-rag
    restart: unless-stopped

networks:
  axiz-rag:
    name: axiz-adaptive-rag-network

volumes:
  qdrant_data:
  memgraph_data:
  runtime_data:
