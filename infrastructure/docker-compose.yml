name: axiz-adaptive-rag-payments

x-backend-image: &backend-image
  image: axiz-adaptive-rag-backend:local
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile.ai
    target: backend

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: axiz-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - axiz-rag
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.13.1
    container_name: axiz-rag-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    networks:
      - axiz-rag
    restart: unless-stopped

  raglight-service:
    image: axiz-raglight-service:local
    env_file:
      - path: ../.env
        required: false
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ai
      target: raglight
    container_name: axiz-rag-raglight
    environment:
      QDRANT_URL: http://qdrant:6333
      RAGLIGHT_CANONICAL_DIR: /app/.runtime/canonical
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
    ports:
      - "8010:8010"
    volumes:
      - runtime_data:/app/.runtime
      - hf_cache_data:/app/.cache
    depends_on:
      - qdrant
    networks:
      - axiz-rag
    restart: unless-stopped

  backend:
    <<: *backend-image
    container_name: axiz-rag-backend
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: docker
      API_HOST: 0.0.0.0
      API_PORT: 8000
      QDRANT_URL: http://qdrant:6333
      MEMGRAPH_URI: bolt://memgraph:7687
      RAGLIGHT_SERVICE_URL: http://raglight-service:8010
      LIGHTRAG_WORKDIR: /app/.runtime/lightrag
      DATASETS_DIR: /app/datasets/sample_documents
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/.runtime
      - hf_cache_data:/app/.cache
    depends_on:
      - qdrant
      - memgraph
      - raglight-service
    networks:
      - axiz-rag
    restart: unless-stopped

  dataset-seed:
    <<: *backend-image
    container_name: axiz-rag-dataset-seed
    command:
      - python
      - datasets/seed.py
      - --api
      - http://backend:8000
      - --wait-seconds
      - "900"
      - --retry-interval
      - "3"
    depends_on:
      - backend
      - raglight-service
    networks:
      - axiz-rag
    restart: "no"

  frontend:
    image: axiz-adaptive-rag-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: axiz-rag-frontend
    ports:
      - "4200:80"
    depends_on:
      backend:
        condition: service_started
      dataset-seed:
        condition: service_completed_successfully
    networks:
      - axiz-rag
    restart: unless-stopped

networks:
  axiz-rag:
    name: axiz-adaptive-rag-network

volumes:
  qdrant_data:
  memgraph_data:
  runtime_data:
  hf_cache_data:
