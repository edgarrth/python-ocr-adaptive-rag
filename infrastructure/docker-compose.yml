services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: axiz-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.13.1
    container_name: axiz-rag-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    restart: unless-stopped

volumes:
  qdrant_data:
  memgraph_data:
