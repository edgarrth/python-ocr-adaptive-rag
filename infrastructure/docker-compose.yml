name: axiz-adaptive-rag-payments

x-backend-image: &backend-image
  image: axiz-adaptive-rag-backend:local
  build:
    context: ..
    dockerfile: infrastructure/Dockerfile.ai
    target: backend

services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: axiz-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - axiz-rag
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:3.13.1
    container_name: axiz-rag-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    networks:
      - axiz-rag
    restart: unless-stopped

  glm-ocr:
    image: axiz-glm-ocr:local
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.glm-ocr
    container_name: axiz-rag-glm-ocr
    env_file:
      - path: ../.env
        required: false
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /root/.cache/huggingface/hub

      # Ejecución normal: CUDA asíncrono. Para diagnosticar un error CUDA concreto,
      # cambiar temporalmente a "1" y volver luego a "0" porque penaliza rendimiento.
      CUDA_LAUNCH_BLOCKING: "${CUDA_LAUNCH_BLOCKING:-0}"

      # INFO evita el volumen de trazas por token. Usar DEBUG solo para diagnóstico.
      VLLM_LOGGING_LEVEL: "${VLLM_LOGGING_LEVEL:-INFO}"

    # ------------------------------------------------------------------------
    # Perfil GPU de GLM-OCR / vLLM
    # ------------------------------------------------------------------------
    # Valores actuales: conservadores para GTX 1650 de 4 GB.
    # El OCR real ya fue confirmado ejecutando inferencia; por eso el perfil
    # normal usa CUDA_LAUNCH_BLOCKING=0 y logging INFO.
    #
    # Punto de partida sugerido para una GPU mejor (por ejemplo >= 8 GB VRAM):
    #   - --cpu-offload-gb: 0
    #   - --gpu-memory-utilization: 0.85
    #   - --max-model-len: 16384
    #   - --max-num-seqs: 2
    #   - --compilation_config.custom_ops: ["all"] o retirar el override
    #   - retirar --enforce-eager después de validar compatibilidad para permitir
    #     torch.compile/CUDA Graphs.
    #   - se pueden retirar los overrides de attention backend y dejar que vLLM
    #     seleccione automáticamente el backend apropiado para la GPU.
    #
    # Punto de partida sugerido para >= 12/16 GB VRAM:
    #   - --gpu-memory-utilization: 0.90
    #   - --max-model-len: 32768
    #   - --max-num-seqs: 4
    #   - --cpu-offload-gb: 0
    #
    # Son valores iniciales, no garantías: subir concurrencia/contexto de a un
    # parámetro por vez y validar /v1/models + OCR real + nvidia-smi.
    command:
      - zai-org/GLM-OCR

      - --served-model-name
      - glm-ocr

      - --host
      - 0.0.0.0

      - --port
      - "8080"

      # GTX 1650 no soporta BF16; FP16 es el perfil seguro actual.
      # GPU moderna compatible: puede dejarse auto o usar el dtype soportado por el modelo/runtime.
      - --dtype
      - half

      # GTX 1650/SM75: se fuerza TRITON_ATTN porque FlashAttention 2 requiere GPU más nueva.
      # GPU moderna: retirar estas dos líneas para que vLLM elija automáticamente.
      - --attention-backend
      - TRITON_ATTN

      # GTX 1650/SM75: encoder visual por PyTorch SDPA.
      # GPU moderna: retirar el override después de validar el backend automático.
      - --mm-encoder-attn-backend
      - TORCH_SDPA

      # GTX 1650/diagnóstico: evita torch.compile y CUDA Graphs.
      # GPU mejor y ya validada: retirar para recuperar optimizaciones de vLLM.
      - --enforce-eager

      # Concurrencia máxima de secuencias.
      # 4 GB: 1 | >=8 GB: empezar con 2 | >=12/16 GB: probar 4.
      - --max-num-seqs
      - "1"

      # Contexto máximo.
      # 4 GB: 8192 (la imagen OCR de prueba usa ~4968 tokens de entrada).
      # >=8 GB: empezar con 16384 | >=12/16 GB: probar 32768.
      # El modelo soporta más contexto; estos límites son conservadores para la PoC.
      - --max-model-len
      - "8192"

      # Fracción objetivo de VRAM administrada por vLLM.
      # 4 GB: 0.70 | >=8 GB: ~0.85 | >=12/16 GB: ~0.90 como punto de partida.
      - --gpu-memory-utilization
      - "0.70"

      # Offload de pesos a RAM para compensar la GTX 1650 de 4 GB.
      # GPU con suficiente VRAM: cambiar a "0" para evitar tráfico CPU<->GPU.
      - --cpu-offload-gb
      - "1"

      # GLM-OCR solo procesa imágenes.
      # Evitamos que vLLM inicialice/profilée la ruta de video.
      - --limit-mm-per-prompt
      - '{"image":1,"video":0}'

      # Evita ejecutar el profiling multimodal ficticio
      - --skip-mm-profiling

      # Diagnóstico SM75: desactiva todos los custom ops de vLLM.
      # GPU mejor / runtime compatible: usar '["all"]' o retirar completamente
      # este override para volver al comportamiento optimizado por defecto.
      - --compilation_config.custom_ops
      - '["none"]'

    gpus: all
    ipc: host
    ports:
      - "8080:8080"
    volumes:
      - hf_cache_data:/root/.cache/huggingface
      - vllm_cache_data:/root/.cache/vllm
    networks:
      - axiz-rag
    restart: unless-stopped

  raglight-service:
    image: axiz-raglight-service:local
    env_file:
      - path: ../.env
        required: false
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.ai
      target: raglight
    container_name: axiz-rag-raglight
    environment:
      QDRANT_URL: http://qdrant:6333
      RAGLIGHT_CANONICAL_DIR: /app/.runtime/canonical
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
    ports:
      - "8010:8010"
    volumes:
      - runtime_data:/app/.runtime
      - hf_cache_data:/app/.cache
    depends_on:
      - qdrant
    networks:
      - axiz-rag
    restart: unless-stopped

  backend:
    <<: *backend-image
    container_name: axiz-rag-backend
    env_file:
      - path: ../.env
        required: false
    environment:
      APP_ENV: docker
      API_HOST: 0.0.0.0
      API_PORT: 8000
      QDRANT_URL: http://qdrant:6333
      MEMGRAPH_URI: bolt://memgraph:7687
      RAGLIGHT_SERVICE_URL: http://raglight-service:8010
      LIGHTRAG_WORKDIR: /app/.runtime/lightrag
      LIGHTRAG_TIMEOUT_SECONDS: "${LIGHTRAG_TIMEOUT_SECONDS:-300}"
      DATASETS_DIR: /app/datasets/sample_documents
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed

      # OCR local: sin consumo de Zhipu MaaS.
      GLM_OCR_MODE: selfhosted
      GLM_OCR_API_URL: http://glm-ocr:8080/v1/chat/completions
      GLM_OCR_MODEL: glm-ocr
      GLM_OCR_LAYOUT_DEVICE: cpu
      GLM_OCR_MAX_WORKERS: "1"
      GLM_OCR_REQUEST_TIMEOUT_SECONDS: "600"
      GLM_OCR_MAX_TOKENS: "2048"
      OCR_POLICY: auto
    ports:
      - "8000:8000"
    volumes:
      - runtime_data:/app/.runtime
      - hf_cache_data:/app/.cache
    depends_on:
      - qdrant
      - memgraph
      - raglight-service
      - glm-ocr
    networks:
      - axiz-rag
    restart: unless-stopped

  dataset-seed:
    <<: *backend-image
    container_name: axiz-rag-dataset-seed
    env_file:
      - path: ../.env
        required: false
    environment:
      # El seed usa el pipeline Python directamente. No llama a backend:8000,
      # por lo que la API queda libre mientras LightRAG/RAGLight indexan.
      APP_ENV: docker
      QDRANT_URL: http://qdrant:6333
      MEMGRAPH_URI: bolt://memgraph:7687
      RAGLIGHT_SERVICE_URL: http://raglight-service:8010
      LIGHTRAG_WORKDIR: /app/.runtime/lightrag
      LIGHTRAG_TIMEOUT_SECONDS: "${LIGHTRAG_TIMEOUT_SECONDS:-300}"
      DATASETS_DIR: /app/datasets/sample_documents
      HF_HOME: /app/.cache/huggingface
      HUGGINGFACE_HUB_CACHE: /app/.cache/huggingface/hub
      SENTENCE_TRANSFORMERS_HOME: /app/.cache/sentence-transformers
      FASTEMBED_CACHE_PATH: /app/.cache/fastembed

      # El dataset base son Markdown, por lo que el bootstrap no necesita OCR.
      # Se conserva la URL correcta por coherencia si se agregan PDF/imágenes
      # al DATASETS_DIR en una ampliación de la PoC.
      GLM_OCR_MODE: selfhosted
      GLM_OCR_API_URL: http://glm-ocr:8080/v1/chat/completions
      GLM_OCR_MODEL: glm-ocr
      GLM_OCR_LAYOUT_DEVICE: cpu
      GLM_OCR_MAX_WORKERS: "1"
      GLM_OCR_REQUEST_TIMEOUT_SECONDS: "600"
      GLM_OCR_MAX_TOKENS: "2048"
      OCR_POLICY: auto
    command:
      - python
      - datasets/seed.py
      - --wait-seconds
      - "900"
      - --retry-interval
      - "3"
    volumes:
      # Comparte canonical/LightRAG con backend y RAGLight.
      - runtime_data:/app/.runtime
      # Reutiliza modelos/embeddings descargados por los demás servicios.
      - hf_cache_data:/app/.cache
    depends_on:
      - qdrant
      - memgraph
      - raglight-service
    networks:
      - axiz-rag
    restart: "no"

  frontend:
    image: axiz-adaptive-rag-frontend:local
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: axiz-rag-frontend
    ports:
      - "4200:80"
    # La UI arranca apenas el backend está disponible. No espera al dataset-seed:
    # el bootstrap puede tardar varios minutos y ya no bloquea la API.
    # Las consultas RAG completas requieren que el seed haya terminado, pero la
    # interfaz debe estar disponible desde el inicio para observar el estado.
    depends_on:
      backend:
        condition: service_started
    networks:
      - axiz-rag
    restart: unless-stopped

networks:
  axiz-rag:
    name: axiz-adaptive-rag-network

volumes:
  qdrant_data:
  memgraph_data:
  runtime_data:
  hf_cache_data:
  vllm_cache_data:
