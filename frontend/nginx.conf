server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;


  # Chat SSE: desactiva buffering para que los deltas lleguen al navegador
  # conforme el backend recupera contexto y genera la respuesta.
  location = /api/v1/query/stream {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    gzip off;
    proxy_connect_timeout 10s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
    add_header X-Accel-Buffering no;
  }

  # La suite de Evals ejecuta varias estrategias sobre todo el dataset y puede
  # superar el timeout por defecto de Nginx (60 s). El smoke test llama al
  # backend directamente, pero la UI pasa por este proxy, por eso este endpoint
  # necesita un timeout específico y suficientemente amplio.
  location = /api/v1/evaluations/run {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_send_timeout 1800s;
    proxy_read_timeout 1800s;
    send_timeout 1800s;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
