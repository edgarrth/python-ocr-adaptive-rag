[build-system]
requires = ["setuptools>=80.9.0", "wheel>=0.46.1"]
build-backend = "setuptools.build_meta"

[project]
name = "axiz-adaptive-rag-payments"
version = "0.1.12"
description = "PoC de RAG adaptativo y GraphRAG para conocimiento de payment processing"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "python-multipart==0.0.32",
  "httpx==0.28.1",
  "qdrant-client[fastembed]==1.19.1",
  "neo4j==6.3.1",
  "docling==2.130.0",
  "glmocr==0.1.5",
  "lightrag-hku==1.5.7",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "ruff==0.16.9",
]

[project.scripts]
axiz-api = "pe.axiz.payment_knowledge.main:run"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
