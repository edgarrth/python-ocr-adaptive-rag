[build-system]
requires = ["setuptools>=80.9.0", "wheel>=0.46.1"]
build-backend = "setuptools.build_meta"

[project]
name = "axiz-raglight-service"
version = "0.2.3"
description = "Servicio aislado de RAGLight para la PoC de payment knowledge"
requires-python = ">=3.12,<3.14"
dependencies = [
  "raglight[qdrant]==3.4.7",
  # RAGLight 3.4.7 instala LangGraph 1.0.x; versiones más nuevas de
  # langgraph-prebuilt importan APIs que no existen en langgraph 1.0.5.
  # Se fija el conjunto compatible para evitar el ImportError en runtime.
  "langgraph==1.0.5",
  "langgraph-prebuilt==1.0.5",
  "langgraph-checkpoint==3.0.1",
  "langgraph-sdk==0.3.0",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "ruff==0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
